<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover events and connect with people around you using real-time geolocation technology. Find local meetups, celebrations, and community gatherings near you." />
    <meta name="keywords" content="events, geolocation, local events, community, meetups, discover, connect" />
    <meta name="theme-color" content="#050511" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />

    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- Open Graph / Social Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://methynixconnect.com" />
    <meta property="og:title" content="Methynix Connect - Discover Events Near You" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Methynix Connect - Discover Events Near You" />

    <title>Methynix Connect - Discover Events Near You</title>

    <div id="root"></div>
    <div id="modal-root"></div>
